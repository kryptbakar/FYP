name: ci

# Lint, test, build and scan on every push / PR to main.
# These gates are what a Fortune-500 vendor assessment expects to see green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: python unit tests (ml + api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyrex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The orchestrator requirements are NOT optional here: the test run below includes
      # services/investigation-orchestrator/tests, and without langgraph those files fail
      # at COLLECTION. pytest reports that as an error, not a failure, and it is easy to
      # scroll past - so the graph tests were never actually running in CI.
      - name: Install deps
        run: >
          pip install
          -r services/api/requirements.txt
          -r ml/requirements.txt
          -r services/investigation-orchestrator/requirements.txt
          pytest pytest-asyncio
      # -p no:cacheprovider: the runner's checkout is not always writable by the test
      # user, and a cache-write warning in a security project's CI is noise nobody reads.
      - name: Run tests
        run: >
          python -m pytest -q -p no:cacheprovider
          ml/tests
          services/api/tests
          services/enrichment/tests
          services/feed-sync/tests
          services/investigation-orchestrator/tests

  ml-evaluation:
    name: risk-engine evaluation (baselines + fusion)
    runs-on: ubuntu-latest
    needs: [python-tests]
    # ml/train.py defaults MODEL_DIR to /models, which is where the compose service mounts
    # its volume. Creating a directory at the filesystem ROOT needs root, and the GitHub
    # runner is the unprivileged `runner` user, so every step here died with
    # `PermissionError: [Errno 13] Permission denied: '/models'`. It passed locally because
    # containers run as root - the classic "works in Docker, fails on the runner" split.
    # This job had been red since 2026-07-13 for that one reason.
    # NOTE: `github.workspace`, not `runner.temp`. The `runner` context is NOT available in
    # a job-level `env:` - no runner is assigned when that block is evaluated - and using
    # it there is a workflow VALIDATION error, so the whole run fails to start with zero
    # jobs and the run name falls back to the raw file path. Cost me one push to learn.
    env:
      MODEL_DIR: ${{ github.workspace }}/.model-cache
    defaults:
      run:
        working-directory: vyrex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML deps
        run: pip install -r ml/requirements.txt
      - name: Ranking experiment (CVSS vs composite vs ML)
        working-directory: vyrex/ml
        run: python evaluate.py --out ../reports
      - name: Fusion dedup evaluation
        working-directory: vyrex/ml
        run: python eval_fusion.py --out ../reports
      - name: Attack-scenario validation (fusion + ranking on a scripted intrusion)
        working-directory: vyrex/ml
        run: python attack_scenario.py --out ../reports
      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: vyrex-evaluation-reports
          path: vyrex/reports/*.md

  js-check:
    name: console JS syntax + contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyrex/web/console/assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --check all console scripts
        run: for f in *.js; do node --check "$f"; done
      # Syntax alone would not have caught the "failed write reports success" bug.
      - name: console contract tests
        working-directory: vyrex
        run: for t in web/console/tests/*.test.js; do node "$t"; done

  airgap-coverage:
    name: air-gap sealing covers every service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Static check, no Docker daemon needed. Catches the quiet failure this repo
      # actually shipped: a service added to a compose file but forgotten in the sealing
      # overlay keeps full egress, nothing warns, the stack works, and the air-gap claim
      # silently stops being true. 21 of 35 services were unsealed on 2026-08-28 while
      # the runtime egress check still reported AIR-GAP ENFORCED.
      - name: every compose service is sealed or explicitly exempt
        working-directory: vyrex
        run: python tools/airgap/check-coverage.py
      - name: shell syntax of the air-gap scripts
        working-directory: vyrex
        run: bash -n tools/airgap/bundle.sh tools/airgap/install.sh tools/airgap/verify-egress.sh

  go-build:
    name: go vet + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: ingest-edge
        working-directory: vyrex/services/ingest-edge
        run: |
          mkdir -p schema
          cp ../../schema/telemetry/v1/envelope.schema.json schema/envelope.schema.json
          go mod tidy
          go vet ./...
          go build ./...
          go test ./...
      - name: agent
        working-directory: vyrex/agent
        run: go vet ./... && go build ./...

  image-scan:
    name: build api image + Trivy scan
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t vyrex/api:ci vyrex/services/api
      # GATE: fail the build on a fixable CRITICAL vulnerability in the API image.
      # (Pinned to the 0.35.0 commit SHA — not a tag: trivy-action releases 0.0.1-0.34.2
      # were compromised in the March 2026 supply-chain attack, malicious entrypoint.sh
      # served via force-pushed tags. 0.35.0 is the first clean release, protected by
      # GitHub's immutable-releases feature, and SHA-pins aquasecurity/setup-trivy. See
      # GHSA-69fq-xp46-6x23.)
      - name: Trivy scan — gate on fixable CRITICAL
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: vyrex/api:ci
          format: table
          exit-code: "1" # hardened: block the build on a fixable CRITICAL
          severity: CRITICAL
          ignore-unfixed: true
      # REPORT: surface HIGH findings without failing (informational).
      - name: Trivy scan — report HIGH (non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: vyrex/api:ci
          format: table
          exit-code: "0"
          severity: HIGH
          ignore-unfixed: true

  k3s-smoke:
    name: k3d cluster + Helm validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - uses: azure/setup-helm@v4
      - name: Helm chart smoke test on a live K3s cluster
        working-directory: vyrex
        run: bash deploy/smoke/k3d-smoke.sh

  compose-smoke:
    name: compose end-to-end smoke (ingest → assess → score → assert)
    runs-on: ubuntu-latest
    # Heavier: stands up the whole stack. Independent of the unit jobs so a fast
    # unit failure still surfaces first.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Free disk + raise vm.max_map_count (OpenSearch needs it)
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker image prune -af >/dev/null 2>&1 || true
      - name: End-to-end pipeline smoke
        working-directory: vyrex
        run: bash deploy/smoke/compose-smoke.sh
      - name: Dump container logs on failure
        if: failure()
        working-directory: vyrex
        run: docker compose logs --tail=120 || true
